<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحه لاگین</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f4;
        }
        .container {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 300px;
        }
        .input-field {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .btn {
            width: 100%;
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn:hover {
            background-color: #45a049;
        }
        .message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>ورود با ایمیل</h2>

        <!-- فرم ارسال ایمیل -->
        <form id="sendForm">
            <label for="email">ایمیل:</label>
            <input type="email" id="email" class="input-field" placeholder="ایمیل خود را وارد کنید" required>
            <button type="submit" class="btn">ارسال ایمیل</button>
        </form>

        <!-- فرم تایید کد -->
        <form id="checkForm" style="display:none;">
            <label for="code">کد تایید:</label>
            <input type="text" id="code" class="input-field" placeholder="کد تایید را وارد کنید" required>
            <button type="submit" class="btn">تایید کد</button>
        </form>

        <!-- نمایش پیام -->
        <div id="message" class="message"></div>
    </div>

    <script>
        // ارسال ایمیل
        document.getElementById('sendForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;

            // ارسال درخواست POST به send.php
            fetch('send.php', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: `email=${encodeURIComponent(email)}`
            })
            .then(response => response.text())
            .then(data => {
                if (data.trim() === 'email sent') {
                    document.getElementById('message').innerText = 'ایمیل ارسال شد. کد تایید را وارد کنید.';
                    document.getElementById('sendForm').style.display = 'none';
                    document.getElementById('checkForm').style.display = 'block';
                } else {
                    document.getElementById('message').innerText = data;
                }
            })
            .catch(error => {
                document.getElementById('message').innerText = 'خطا در ارسال درخواست.';
            });
        });

        // تایید کد
        document.getElementById('checkForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const code = document.getElementById('code').value;

            // ارسال درخواست POST به check.php
            fetch('check.php', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: `email=${encodeURIComponent(email)}&code=${encodeURIComponent(code)}`
            })
            .then(response => response.text())
            .then(data => {
                if (data.trim() === 'ok') {
                    // هدایت به صفحه جدید با پیام تایید
                    window.location.href = 'success.html'; // صفحه جدید برای موفقیت
                } else {
                    document.getElementById('message').innerText = data;
                }
            })
            .catch(error => {
                document.getElementById('message').innerText = 'خطا در ارسال درخواست.';
            });
        });
    </script>
</body>
</html>
